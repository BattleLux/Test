name: Install and Reduce Swift Size on Ubuntu 26.04

on:
  workflow_dispatch:

jobs:
  build-and-cleanup:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Swift
      run: |
        SWIFT_VERSION=6.4.0
        SUFFIX=$([ "$(uname -m)" = "aarch64" ] && echo "-aarch64" || true)
        NAME="swift-${SWIFT_VERSION}-RELEASE-ubuntu26.04${SUFFIX}"
        URL="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2604${SUFFIX}/swift-${SWIFT_VERSION}-RELEASE/${NAME}.tar.gz"
        curl -fsSL "$URL" -o "$RUNNER_TEMP/swift.tar.gz"
        curl -fsSL "$URL.sig" -o "$RUNNER_TEMP/swift.tar.gz.sig"
        curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
        gpg --verify "$RUNNER_TEMP/swift.tar.gz.sig" "$RUNNER_TEMP/swift.tar.gz"
        mkdir -p "$RUNNER_TEMP/swift"
        tar xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
        echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"

    - name: Verify Version and Reduce Swift Size
      run: |
        # 1. Print Swift version details
        echo "=== Swift Version Info ==="
        "$RUNNER_TEMP/swift/usr/bin/swift" --version
        echo ""

        # 2. Check and log directory footprint before processing
        echo "=== Size BEFORE Reduction ==="
        du -sh "$RUNNER_TEMP/swift"
        echo ""

        # 3. Clean up non-compilation development toolbloat
        echo "=== Trimming Swift Toolchain Infrastructure ==="
        
        # Eliminate the heavy LLDB debug engine (~450 MB)
        rm -f  "$RUNNER_TEMP/swift/usr/bin/lldb"*
        rm -rf "$RUNNER_TEMP/swift/usr/lib/liblldb"*
        
        # Eliminate optional test frameworks and helper maps (~60 MB)
        rm -f "$RUNNER_TEMP/swift/usr/bin/swift-test" "$RUNNER_TEMP/swift/usr/bin/swift-demangle"
        
        # Force-delete heavy static asset archives if not compiling static self-contained packages (~300 MB)
        find "$RUNNER_TEMP/swift/usr/lib/swift/linux" -type f -name "*.a" -delete

        # 4. Aggressively strip symbols using absolute binaries to ensure reduction (~1.2 GB+ saved)
        # This targets the actual heavy components like swift-frontend and clang
        echo "=== Stripping Debug Symbols ==="
        find "$RUNNER_TEMP/swift/usr/bin" -type f -exec strip --strip-all {} + 2>/dev/null || true
        find "$RUNNER_TEMP/swift/usr/libexec" -type f -exec strip --strip-all {} + 2>/dev/null || true
        
        echo "Reduction tasks complete."
        echo ""

        # 5. Measure absolute footprint after processing
        echo "=== Size AFTER Reduction ==="
        du -sh "$RUNNER_TEMP/swift"

    - name: Sanity Check Build
      run: |
        # Smoke test to ensure code compilation still works flawlessly
        echo 'print("Reduced compilation environment is working perfectly!")' > test.swift
        swiftc test.swift
        ./test
