name: Repro

on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      matrix:
        os: 
          - xcode-27
          - macos-26-intel
          - macos-26
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Create a basic repro.cs file on the fly for testing
      - name: Create repro.cs
        run: |
          echo 'Console.WriteLine("Hello from .NET 10 on " + Environment.OSVersion);' > repro.cs

      - run: dotnet run repro.cs
